name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Note($title, $text) {
            $t = ($text -replace "`r","" -replace "%","%25" -replace "`n","%0A")
            if ($t.Length -gt 3500) { $t = $t.Substring(0,3500) }
            Write-Output "::notice title=$title::$t"
          }
          $ua = @{ 'User-Agent' = 'Mozilla/5.0 Ferrodrive' }
          $id = 'LAPTOPS-AND-NETBOOKS/LENOVO-Z-SERIES-LAPTOPS/LENOVO-Z50-70/20354'
          $variants = @(
            @{ n='referer'; h=@{ 'User-Agent'='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'; 'Referer'='https://pcsupport.lenovo.com/' }; u="https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id" },
            @{ n='refererfull'; h=@{ 'User-Agent'='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'; 'Referer'="https://pcsupport.lenovo.com/us/en/products/$($id.ToLower())/downloads/driver-list"; 'Accept'='application/json, text/plain, */*'; 'X-Requested-With'='XMLHttpRequest' }; u="https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id" }
          )
          $unused = @(
            @{ n='plain'; h=$ua; u="https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id" },
            @{ n='referer'; h=@{ 'User-Agent'='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'; 'Referer'="https://pcsupport.lenovo.com/us/en/products/$($id.ToLower())/downloads/driver-list"; 'Accept'='application/json, text/plain, */*'; 'X-Requested-With'='XMLHttpRequest' }; u="https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id" },
            @{ n='lower'; h=$ua; u="https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$($id.ToLower())" },
            @{ n='ww'; h=$ua; u="https://pcsupport.lenovo.com/ww/en/api/v4/downloads/drivers?productId=$id" }
          )
          foreach ($v in $variants) {
            try {
              $d = Invoke-WebRequest -UseBasicParsing -Headers $v.h $v.u
              Note "lenovo-$($v.n)" "$($d.StatusCode) len=$($d.Content.Length) $($d.Content.Substring(0, [Math]::Min(300, $d.Content.Length)))"
              $j = $d.Content | ConvertFrom-Json
              if ($j.body.DownloadItems) {
                $lines = $j.body.DownloadItems | % { "$($_.Title) | $($_.Category.Name) | $($_.OperatingSystemKeys -join ';') | " + (($_.Files | ? { $_.TypeString -ne 'HTML' -and $_.TypeString -ne 'TXT' } | % { "$($_.TypeString) $($_.Version) $($_.URL)" }) -join ' ; ') }
                $all = $lines -join "`n"
                for ($i = 0; $i -lt $all.Length; $i += 3400) { Note ("lenovo-items-{0:D2}" -f ($i / 3400)) $all.Substring($i, [Math]::Min(3400, $all.Length - $i)) }
                $bios = $j.body.DownloadItems | ? { $_.Category.Name -eq 'BIOS/UEFI' } | Select-Object -First 1
                if ($bios) { Note 'lenovo-bios-item' ($bios | ConvertTo-Json -Depth 6) }
              }
            } catch { Note "lenovo-$($v.n)-error" $_.ToString() }
          }
          try {
            $c = Invoke-WebRequest -UseBasicParsing -Headers $ua 'https://download.lenovo.com/catalog/20QD_Win10.xml'
            Note 'lenovo-catalog' $c.Content.Substring(0, [Math]::Min(3000, $c.Content.Length))
          } catch { Note 'lenovo-catalog-error' $_.ToString() }
          try {
            Invoke-WebRequest -UseBasicParsing -Headers $ua 'https://hpia.hpcloud.hp.com/ref/platformList.cab' -OutFile pl.cab
            expand.exe pl.cab pl.xml | Out-Null
            $x = Get-Content pl.xml -Raw
            Note 'hp-platformlist' $x.Substring(0, [Math]::Min(3000, $x.Length))
          } catch { Note 'hp-error' $_.ToString() }
          try {
            Invoke-WebRequest -UseBasicParsing -Headers $ua 'https://downloads.dell.com/catalog/CatalogIndexPC.cab' -OutFile ci.cab
            expand.exe ci.cab ci.xml | Out-Null
            $x = Get-Content ci.xml -Raw
            Note 'dell-index' $x.Substring(0, [Math]::Min(3000, $x.Length))
          } catch { Note 'dell-error' $_.ToString() }
