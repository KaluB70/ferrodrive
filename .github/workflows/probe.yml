name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Note($title, $text) {
            $t = ($text -replace "`r","" -replace "%","%25" -replace "`n","%0A")
            Write-Output ("::notice title={0}::{1}" -f $title, $t.Substring(0, [Math]::Min(1500, $t.Length)))
          }
          $id = 'LAPTOPS-AND-NETBOOKS/LENOVO-Z-SERIES-LAPTOPS/LENOVO-Z50-70/20354'
          $low = $id.ToLower()
          $h = @{ 'Referer'='https://pcsupport.lenovo.com/'; 'Accept'='application/json' }
          function Try1($name, $url, $session) {
            try {
              if ($session) { $r = Invoke-WebRequest -UseBasicParsing $url -Headers $h -WebSession $session } else { $r = Invoke-WebRequest -UseBasicParsing $url -Headers $h }
              Note $name ("HTTP " + $r.StatusCode + " len " + $r.Content.Length + " :: " + $r.Content.Substring(0, [Math]::Min(600, $r.Content.Length)))
            } catch { Note "$name-error" $_.ToString() }
          }
          Try1 'getproducts' "https://pcsupport.lenovo.com/us/en/api/v4/mse/getproducts?productId=20354"
          Try1 'lower' "https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$low"
          Try1 'nolocale' "https://pcsupport.lenovo.com/api/v4/downloads/drivers?productId=$id"
          Try1 'ww-en' "https://pcsupport.lenovo.com/ww/en/api/v4/downloads/drivers?productId=$id"
          Try1 'lang-param' "https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id&language=en&country=us"
          Try1 'downloadsv2' "https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers/v2?productId=$id"
          $s = $null
          try { Invoke-WebRequest -UseBasicParsing "https://pcsupport.lenovo.com/us/en/products/$low/downloads/driver-list" -SessionVariable s | Out-Null; Note 'cookies' (($s.Cookies.GetCookies('https://pcsupport.lenovo.com') | % { $_.Name + '=' + $_.Value.Substring(0,[Math]::Min(40,$_.Value.Length)) }) -join '; ') } catch { Note 'page-error' $_.ToString() }
          if ($s) { Try1 'with-cookies' "https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id" $s }
          try { $p = Invoke-WebRequest -UseBasicParsing "https://pcsupport.lenovo.com/us/en/products/$low/downloads/driver-list"; $m = [regex]::Matches($p.Content, 'api/v\d/[A-Za-z/]+') | % Value | Sort-Object -Unique; Note 'page-apis' ($m -join "`n") } catch { Note 'page2-error' $_.ToString() }
