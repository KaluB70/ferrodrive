name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Note($title, $text) {
            $t = ($text -replace "`r","" -replace "%","%25" -replace "`n","%0A")
            Write-Output ("::notice title={0}::{1}" -f $title, $t.Substring(0, [Math]::Min(1500, $t.Length)))
          }
          $id = 'LAPTOPS-AND-NETBOOKS/LENOVO-Z-SERIES-LAPTOPS/LENOVO-Z50-70/20354'
          $url = "https://pcsupport.lenovo.com/us/en/api/v4/downloads/drivers?productId=$id"
          $browser = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          $variants = [ordered]@{
            'current'      = @{ 'Referer'='https://pcsupport.lenovo.com/'; 'Accept'='application/json'; 'User-Agent'='Ferrodrive/0.1.0' }
            'lang-header'  = @{ 'Referer'='https://pcsupport.lenovo.com/'; 'Accept'='application/json'; 'User-Agent'='Ferrodrive/0.1.0'; 'Accept-Language'='en-US,en;q=0.9' }
            'referer-usen' = @{ 'Referer'='https://pcsupport.lenovo.com/us/en/'; 'Accept'='application/json'; 'User-Agent'='Ferrodrive/0.1.0' }
            'referer-prod' = @{ 'Referer'="https://pcsupport.lenovo.com/us/en/products/$($id.ToLower())/downloads/driver-list"; 'Accept'='application/json'; 'User-Agent'='Ferrodrive/0.1.0' }
            'browser-ua'   = @{ 'Referer'='https://pcsupport.lenovo.com/'; 'Accept'='application/json'; 'User-Agent'=$browser; 'Accept-Language'='en-US,en;q=0.9' }
            'all'          = @{ 'Referer'='https://pcsupport.lenovo.com/us/en/'; 'Accept'='application/json, text/plain, */*'; 'User-Agent'=$browser; 'Accept-Language'='en-US,en;q=0.9'; 'X-Requested-With'='XMLHttpRequest' }
          }
          foreach ($k in $variants.Keys) {
            $out = ''
            foreach ($try in 1..2) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing $url -Headers $variants[$k]
                $out += "[$try] HTTP " + $r.StatusCode + " len " + $r.Content.Length + " :: " + $r.Content.Substring(0, [Math]::Min(250, $r.Content.Length)) + "`n"
              } catch { $out += "[$try] error " + $_.ToString().Substring(0, [Math]::Min(250, $_.ToString().Length)) + "`n" }
            }
            Note $k $out
          }
