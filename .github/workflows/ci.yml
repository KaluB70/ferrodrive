name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: ferro.exe
          - os: ubuntu-latest
            bin: ferro
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release -p ferrodrive-cli
      - name: Smoke test
        run: target/release/${{ matrix.bin }} scan
      - uses: actions/upload-artifact@v4
        with:
          name: ferro-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ferro-windows-latest
      - uses: softprops/action-gh-release@v2
        with:
          files: ferro.exe
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
