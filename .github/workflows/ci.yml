name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: ferro.exe
            workspace: --workspace
          - os: ubuntu-latest
            bin: ferro
            # The desktop app is Windows-first; Linux CI covers core and CLI.
            workspace: --workspace --exclude ferrodrive-app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        if: runner.os == 'Windows'
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: cargo clippy ${{ matrix.workspace }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.workspace }}
      - run: cargo build --release -p ferrodrive-cli
      - name: Build desktop app
        if: runner.os == 'Windows'
        run: cargo build --release -p ferrodrive-app --features tauri/custom-protocol
      - name: Smoke test desktop app CLI mode
        if: runner.os == 'Windows'
        run: target/release/ferrodrive.exe scan --json | Out-Null
        shell: pwsh
      - name: Smoke test
        run: target/release/${{ matrix.bin }} scan
      - name: Smoke test check
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        run: target/release/${{ matrix.bin }} check
      - name: Vendor catalog smoke tests
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $machines = @{
            thinkpad = 'LENOVO|20QDCTO1WW|||N2HET70W (1.53 )'
            hp       = 'HP||8549||R70 Ver. 01.30.00'
            dell     = 'Dell Inc.|||07E8|1.0.0'
          }
          foreach ($m in $machines.GetEnumerator()) {
            $env:FERRO_PRETEND = $m.Value
            $out = (& target/release/ferro.exe check 2>&1 | Out-String)
            $text = $out -replace "`r","" -replace "%","%25" -replace "`n","%0A"
            Write-Output "::notice title=catalog-$($m.Key)::$($text.Substring(0, [Math]::Min(3400, $text.Length)))"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ferro-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ferrodrive-app
          path: target/release/ferrodrive.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ferro-windows-latest
      - uses: softprops/action-gh-release@v2
        with:
          files: ferro.exe
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true

  # Rolling prerelease so the latest Windows build is always at
  # https://github.com/KaluB70/ferrodrive/releases/download/nightly/ferro.exe
  nightly:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ferro-windows-latest
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ferrodrive-app
          path: dist
      - name: Move nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin nightly
      - name: Publish nightly release
        run: |
          notes="Latest build of main ($(git rev-parse --short HEAD)). Not a stable release."
          gh release view nightly >/dev/null 2>&1 \
            || gh release create nightly --prerelease --title "Nightly" --notes "$notes"
          gh release edit nightly --notes "$notes"
          gh release upload nightly dist/ferro.exe dist/ferrodrive.exe --clobber
